name: dev-tips validate

on:
  pull_request:
    paths:
      - '**/tip.json'
      - '**/*.tip.json'
      - 'dev-tips/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tip files
        shell: pwsh
        run: ./tools/Test-TipFiles.ps1 -RepoRoot .
